[build]
  command = ""
  publish = "."
  functions = "netlify/functions"

# Keep the backend source files from being served as static pages
[[redirects]]
  from = "/lib/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
